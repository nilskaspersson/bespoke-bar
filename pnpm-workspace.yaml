packages:
  - 'apps/*'
  - 'packages/*'

# Flat, npm-style node_modules. Required because many deps peer-depend on
# `react`/`typescript` but not the corresponding `@types/*`, and pnpm's isolated
# layout hides those types from the libs' own .d.ts (collapsing React.ReactNode
# and tRPC ctx/input to `any`). Also required by Expo/Metro (monorepo plan step 6).
nodeLinker: hoisted

allowBuilds:
  '@clerk/shared': false
  '@google/genai': false
  '@parcel/watcher': true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  utf-8-validate: false

catalog:
  "@biomejs/biome": 2.4.16
  "@clerk/nextjs": 7.5.15
  "@tanstack/react-query": 5.100.10
  "@trpc/client": 11.17.0
  "@trpc/react-query": 11.17.0
  "@trpc/server": 11.17.0
  "@trpc/tanstack-react-query": 11.17.0
  "@types/node": 25.9.1
  "@types/react": 19.2.15
  "@types/react-dom": 19.2.3
  "@upstash/redis": 1.38.0
  "@vitejs/plugin-react": 6.0.2
  babel-plugin-react-compiler: 1.0.0
  clsx: 2.1.1
  dotenv: 17.4.2
  downshift: 9.3.2
  drizzle-orm: 0.45.2
  jsdom: 29.1.1
  motion: 12.38.0
  next: 16.2.9
  react: 19.2.3
  react-dom: 19.2.3
  sonner: 2.0.7
  stripe: 22.2.0
  typescript: 6.0.3
  typescript-plugin-css-modules: 5.2.0
  vitest: 4.1.7
  zod: 4.4.3
  zustand: 5.0.13

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  '@clerk/nextjs>next': 'catalog:'
  'nuqs>next': 'catalog:'
  '@clerk/react': '6.12.1'
  '@clerk/backend': '3.11.2'
  '@clerk/shared@^4': '4.25.1'

minimumReleaseAgeExclude:
  - '@clerk/backend@3.11.2'
  - '@clerk/clerk-js@6.25.1'
  - '@clerk/expo@3.7.2'
  - '@clerk/react@6.12.1'
  - '@clerk/shared@4.25.1'
  - '@clerk/nextjs@7.5.15'
