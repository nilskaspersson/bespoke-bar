packages:
  - 'apps/*'
  - 'packages/*'

# Flat, npm-style node_modules. Required because many deps peer-depend on
# `react`/`typescript` but not the corresponding `@types/*`, and pnpm's isolated
# layout hides those types from the libs' own .d.ts (collapsing React.ReactNode
# and tRPC ctx/input to `any`). Also required by Expo/Metro (monorepo plan step 6).
nodeLinker: hoisted

allowBuilds:
  '@clerk/shared': false
  '@google/genai': false
  '@parcel/watcher': true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  utf-8-validate: false

catalog:
  "@biomejs/biome": 2.5.12
  "@clerk/nextjs": 7.9.1
  "@tanstack/query-sync-storage-persister": 5.102.8
  "@tanstack/react-query": 5.102.8
  "@tanstack/react-query-persist-client": 5.102.8
  "@trpc/client": 11.18.0
  "@trpc/react-query": 11.18.0
  "@trpc/server": 11.18.0
  "@trpc/tanstack-react-query": 11.18.0
  "@types/node": 26.4.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  "@upstash/redis": 1.38.4
  "@vitejs/plugin-react": 6.1.1
  babel-plugin-react-compiler: 1.0.0
  clsx: 2.1.1
  dotenv: 17.4.2
  downshift: 9.4.0
  drizzle-orm: 0.45.2
  jsdom: 30.0.1
  motion: 13.2.0
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  sonner: 2.0.8
  stripe: 22.6.1
  typescript: 7.0.2
  typescript-plugin-css-modules: 5.2.0
  vitest: 5.0.0
  zod: 4.5.4
  zustand: 5.0.15

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  '@clerk/nextjs>next': 'catalog:'
  'nuqs>next': 'catalog:'
  '@clerk/react': '6.15.1'
  '@clerk/backend': '3.17.1'
  '@clerk/shared@^4': '4.31.0'

minimumReleaseAgeExclude:
  - '@clerk/backend@3.17.1'
  - '@clerk/clerk-js@6.25.6'
  - '@clerk/expo@3.7.8'
  - '@clerk/react@6.15.1'
  - '@clerk/shared@4.31.0'
  - '@clerk/nextjs@7.9.1'
  - '@iconify/utils@3.1.5'
  - '@upstash/redis@1.38.4'
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-router@57.0.19
