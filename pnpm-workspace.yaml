packages:
  - 'apps/*'
  - 'packages/*'

# Flat, npm-style node_modules. Required because many deps peer-depend on
# `react`/`typescript` but not the corresponding `@types/*`, and pnpm's isolated
# layout hides those types from the libs' own .d.ts (collapsing React.ReactNode
# and tRPC ctx/input to `any`). Also required by Expo/Metro (monorepo plan step 6).
nodeLinker: hoisted

allowBuilds:
  '@clerk/shared': false
  '@google/genai': false
  '@parcel/watcher': true
  esbuild: true
  protobufjs: false
  sharp: true

catalog:
  "@biomejs/biome": 2.4.16
  "@clerk/nextjs": 7.4.2
  "@types/node": 25.9.1
  "@types/react": 19.2.15
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.2
  babel-plugin-react-compiler: 1.0.0
  clsx: 2.1.1
  dotenv: 17.4.2
  drizzle-orm: 0.45.2
  jsdom: 29.1.1
  next: 16.2.9
  react: 19.2.7
  react-dom: 19.2.7
  stripe: 22.2.0
  typescript: 6.0.3
  typescript-plugin-css-modules: 5.2.0
  vitest: 4.1.7
  zod: 4.4.3

overrides:
  '@clerk/nextjs>next': 'catalog:'
  'nuqs>next': 'catalog:'
  '@clerk/react': '6.7.2'
  '@clerk/backend': '3.4.14'
  '@clerk/shared@^4': '4.14.0'
